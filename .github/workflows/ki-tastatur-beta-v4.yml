name: KI Tastatur Beta v4

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'florisboard-de/**'
      - 'florisboard-ai/**'
      - 'assets/**'
      - 'README.md'
      - 'KI-Tastatur-RELEASE.md'
      - '.github/workflows/ki-tastatur-beta-v4.yml'
  workflow_dispatch:

concurrency:
  group: ki-tastatur-beta-v4-product-ui
  cancel-in-progress: true

jobs:
  build-beta-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout FlorisBoard base source
        uses: actions/checkout@v4
        with:
          repository: florisboard/florisboard
          ref: v0.5.2
          submodules: recursive
          path: florisboard

      - name: Checkout exact JetPref snapshot source
        uses: actions/checkout@v4
        with:
          repository: patrickgold/jetpref
          ref: d6e12dda6517345dacc3682aa476a8448a71c34b
          path: jetpref

      - name: Apply complete German localization
        run: python3 controller/florisboard-de/make_german.py

      - name: Apply KI Tastatur branding
        run: python3 controller/florisboard-ai/apply_branding.py

      - name: Add manual AI correction, style menu and Prompt+
        run: python3 controller/florisboard-ai/apply_ai.py

      - name: Add dynamic AI providers
        run: python3 controller/florisboard-ai/apply_backend.py

      - name: Add local translation
        run: python3 controller/florisboard-ai/apply_translation.py

      - name: Apply dedicated KI Tastatur product UI
        run: python3 controller/florisboard-ai/apply_product_ui.py

      - name: Set Beta v4 version and sign release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('florisboard/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          release_marker = '        named("release") {\n'
          release_replacement = '        named("release") {\n            signingConfig = signingConfigs.getByName("debug")\n'
          if release_marker not in s:
              raise SystemExit('release build block not found')
          s = s.replace(release_marker, release_replacement, 1)
          code_marker = '        versionCode = projectVersionCode.toInt()\n'
          if code_marker not in s:
              raise SystemExit('versionCode marker not found')
          s = s.replace(code_marker, '        versionCode = 120\n', 1)
          version_marker = '        versionName = projectVersionName.substringBefore("-")\n'
          if version_marker not in s:
              raise SystemExit('versionName marker not found')
          s = s.replace(version_marker, '        versionName = "1.0.0-beta4"\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Enable locally rebuilt JetPref snapshot
        run: |
          sed -i 's@        // mavenLocal()@        mavenLocal()@' florisboard/settings.gradle.kts
          sed -i 's/projectVersion=0.3.0-beta02/projectVersion=20251119T222500Z-SNAPSHOT/' jetpref/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Rebuild exact JetPref snapshot to Maven Local
        working-directory: jetpref
        run: |
          ./gradlew \
            :datastore-model:publishToMavenLocal \
            :datastore-model-processor:publishToMavenLocal \
            :datastore-ui:publishToMavenLocal \
            :material-ui:publishToMavenLocal

      - name: Build KI Tastatur Beta v4 APK
        working-directory: florisboard
        run: ./gradlew clean assembleRelease

      - name: Verify package and APK
        run: |
          APK='florisboard/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -20
          cp "$APK" KI-Tastatur-Beta-v4.apk
          sha256sum KI-Tastatur-Beta-v4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KI-Tastatur-Beta-v4
          path: KI-Tastatur-Beta-v4.apk

      - name: Publish current Beta and clean obsolete keyboard releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ki-tastatur-beta-v4"
          NOTES_FILE="controller/KI-Tastatur-RELEASE.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "KI Tastatur Beta v4" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "KI Tastatur Beta v4" --notes-file "$NOTES_FILE" --prerelease
          fi
          gh release upload "$TAG" KI-Tastatur-Beta-v4.apk --repo "$GITHUB_REPOSITORY" --clobber

          for old_tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            case "$old_tag" in
              florisboard-*|ki-tastatur-v0.5.2*)
                if [ "$old_tag" != "$TAG" ]; then
                  gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
                fi
                ;;
            esac
          done
