name: FlorisBoard AI DE v0.5.2 v3

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'florisboard-de/**'
      - 'florisboard-ai/**'
      - '.github/workflows/florisboard-ai-v3.yml'
  workflow_dispatch:

concurrency:
  group: florisboard-ai-de-v052-v3
  cancel-in-progress: true

jobs:
  build-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout exact FlorisBoard v0.5.2
        uses: actions/checkout@v4
        with:
          repository: florisboard/florisboard
          ref: v0.5.2
          submodules: recursive
          path: florisboard

      - name: Checkout exact JetPref snapshot source
        uses: actions/checkout@v4
        with:
          repository: patrickgold/jetpref
          ref: d6e12dda6517345dacc3682aa476a8448a71c34b
          path: jetpref

      - name: Apply complete German localization
        run: python3 controller/florisboard-de/make_german.py

      - name: Add AI correction and style actions
        run: python3 controller/florisboard-ai/apply_ai.py

      - name: Add dynamic AI providers
        run: python3 controller/florisboard-ai/apply_backend.py

      - name: Add local translation
        run: python3 controller/florisboard-ai/apply_translation.py

      - name: Restore true stable package and sign release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('florisboard/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          marker = '        named("release") {\n'
          replacement = '        named("release") {\n            signingConfig = signingConfigs.getByName("debug")\n'
          if marker not in s:
              raise SystemExit('release build block not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Enable locally rebuilt JetPref snapshot
        run: |
          sed -i 's@        // mavenLocal()@        mavenLocal()@' florisboard/settings.gradle.kts
          sed -i 's/projectVersion=0.3.0-beta02/projectVersion=20251119T222500Z-SNAPSHOT/' jetpref/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Rebuild exact JetPref snapshot to Maven Local
        working-directory: jetpref
        run: |
          ./gradlew \
            :datastore-model:publishToMavenLocal \
            :datastore-model-processor:publishToMavenLocal \
            :datastore-ui:publishToMavenLocal \
            :material-ui:publishToMavenLocal

      - name: Build stable German AI v3 APK
        working-directory: florisboard
        run: ./gradlew clean assembleRelease

      - name: Verify package and APK
        run: |
          APK='florisboard/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -20
          cp "$APK" FlorisBoard-0.5.2-AI-DE-v3.apk
          sha256sum FlorisBoard-0.5.2-AI-DE-v3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlorisBoard-0.5.2-AI-DE-v3
          path: FlorisBoard-0.5.2-AI-DE-v3.apk

      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="florisboard-ai-de-v0.5.2-v3"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "FlorisBoard v0.5.2 Deutsch + KI v3" \
              --notes "Fehlerkorrektur für die KI Einstellungen: Anbieter, API Schlüssel und Modell lassen sich jetzt eindeutig speichern und bestätigen. Im Modellbereich wird direkt angezeigt, welches Modell aktiv gespeichert ist. Neuer Button 'Speichern und verwenden', direkte Bestätigung nach der Modellauswahl, synchrones Speichern, Verbindungstest mit sichtbarer Erfolgsanzeige sowie 'Speichern und schließen'. Enthält weiterhin OpenAI, Gemini, Claude, Groq, automatische Modellwahl, KI Schreibfunktionen und lokale ML Kit Übersetzung. Original Paketkennung dev.patrickgold.florisboard."
          fi
          gh release upload "$TAG" FlorisBoard-0.5.2-AI-DE-v3.apk --repo "$GITHUB_REPOSITORY" --clobber
