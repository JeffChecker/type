name: KI Tastatur Pull Request Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'florisboard-de/**'
      - 'florisboard-ai/**'
      - 'assets/**'
      - 'README.md'
      - 'KI-Tastatur-RELEASE.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ki-tastatur-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed controller code
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout FlorisBoard base source
        uses: actions/checkout@v4
        with:
          repository: florisboard/florisboard
          ref: v0.5.2
          submodules: recursive
          path: florisboard

      - name: Checkout exact JetPref snapshot source
        uses: actions/checkout@v4
        with:
          repository: patrickgold/jetpref
          ref: d6e12dda6517345dacc3682aa476a8448a71c34b
          path: jetpref

      - name: Apply project patches
        run: |
          python3 controller/florisboard-de/make_german.py
          python3 controller/florisboard-ai/apply_branding.py
          python3 controller/florisboard-ai/apply_ai.py
          python3 controller/florisboard-ai/apply_backend.py
          python3 controller/florisboard-ai/apply_translation.py
          python3 controller/florisboard-ai/apply_product_ui.py

      - name: Enable locally rebuilt JetPref snapshot
        run: |
          sed -i 's@        // mavenLocal()@        mavenLocal()@' florisboard/settings.gradle.kts
          sed -i 's/projectVersion=0.3.0-beta02/projectVersion=20251119T222500Z-SNAPSHOT/' jetpref/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Rebuild exact JetPref snapshot
        working-directory: jetpref
        run: |
          ./gradlew \
            :datastore-model:publishToMavenLocal \
            :datastore-model-processor:publishToMavenLocal \
            :datastore-ui:publishToMavenLocal \
            :material-ui:publishToMavenLocal

      - name: Compile Android app
        working-directory: florisboard
        run: ./gradlew clean assembleDebug
