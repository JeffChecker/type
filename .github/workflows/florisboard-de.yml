name: FlorisBoard AI DE v0.5.2 Stable

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'florisboard-de/**'
      - 'florisboard-ai/**'
      - '.github/workflows/florisboard-de.yml'
  workflow_dispatch:

concurrency:
  group: florisboard-ai-de-v052-stable
  cancel-in-progress: true

jobs:
  build-de:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout exact FlorisBoard v0.5.2
        uses: actions/checkout@v4
        with:
          repository: florisboard/florisboard
          ref: v0.5.2
          submodules: recursive
          path: florisboard

      - name: Checkout exact JetPref snapshot source
        uses: actions/checkout@v4
        with:
          repository: patrickgold/jetpref
          ref: d6e12dda6517345dacc3682aa476a8448a71c34b
          path: jetpref

      - name: Apply complete German localization
        run: python3 controller/florisboard-de/make_german.py

      - name: Add AI proofreading and style assistant
        run: python3 controller/florisboard-ai/apply_ai.py

      - name: Restore true stable package and sign release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('florisboard/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          marker = '        named("release") {\n'
          replacement = '        named("release") {\n            signingConfig = signingConfigs.getByName("debug")\n'
          if marker not in s:
              raise SystemExit('release build block not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -n -A8 'named("release")' florisboard/app/build.gradle.kts

      - name: Enable locally rebuilt JetPref snapshot
        run: |
          sed -i 's@        // mavenLocal()@        mavenLocal()@' florisboard/settings.gradle.kts
          sed -i 's/projectVersion=0.3.0-beta02/projectVersion=20251119T222500Z-SNAPSHOT/' jetpref/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Rebuild exact JetPref snapshot to Maven Local
        working-directory: jetpref
        run: |
          ./gradlew \
            :datastore-model:publishToMavenLocal \
            :datastore-model-processor:publishToMavenLocal \
            :datastore-ui:publishToMavenLocal \
            :material-ui:publishToMavenLocal

      - name: Build stable German AI APK
        working-directory: florisboard
        run: ./gradlew clean assembleRelease

      - name: Verify package and APK
        run: |
          APK='florisboard/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -20
          cp "$APK" FlorisBoard-0.5.2-AI-DE.apk
          sha256sum FlorisBoard-0.5.2-AI-DE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlorisBoard-0.5.2-AI-DE
          path: FlorisBoard-0.5.2-AI-DE.apk

      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="florisboard-ai-de-v0.5.2"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "FlorisBoard v0.5.2 Deutsch + KI" \
              --notes "FlorisBoard v0.5.2 Stable mit vollständiger deutscher Oberfläche und zusätzlichem KI Schreibassistenten. Die ursprüngliche Autokorrektur Schaltfläche von v0.5.2 war nur ein nicht implementierter Platzhalter und wurde durch eine echte KI Autokorrektur ersetzt. Korrektur erfolgt nach kurzer Schreibpause und berücksichtigt auch größere Textblöcke aus Spracheingabe. Manuelle Stilfunktionen: Korrigieren, Freundlich, Professionell, Locker, Humorvoll, Ironisch, Kurz, Einfach und Direkt. Als KI Backend wird Groq verwendet; der Nutzer trägt seinen eigenen kostenlosen API Schlüssel in den KI Einstellungen ein. Passwort-, E-Mail/URL-Felder, rohe Eingabefelder und Inkognito werden nicht automatisch an die KI gesendet. Original Paketkennung dev.patrickgold.florisboard, Stable/Release Build. Eigener Signierschlüssel: eine offiziell signierte oder anders signierte FlorisBoard Installation muss vor der Installation gegebenenfalls deinstalliert werden."
          fi
          gh release upload "$TAG" FlorisBoard-0.5.2-AI-DE.apk --repo "$GITHUB_REPOSITORY" --clobber
