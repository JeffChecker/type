name: KI Tastatur v0.5.2 v4

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'florisboard-de/**'
      - 'florisboard-ai/**'
      - '.github/workflows/florisboard-ai-v4.yml'
  workflow_dispatch:

concurrency:
  group: ki-tastatur-v052-v4
  cancel-in-progress: true

jobs:
  build-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout exact FlorisBoard v0.5.2 source
        uses: actions/checkout@v4
        with:
          repository: florisboard/florisboard
          ref: v0.5.2
          submodules: recursive
          path: florisboard

      - name: Checkout exact JetPref snapshot source
        uses: actions/checkout@v4
        with:
          repository: patrickgold/jetpref
          ref: d6e12dda6517345dacc3682aa476a8448a71c34b
          path: jetpref

      - name: Apply complete German localization
        run: python3 controller/florisboard-de/make_german.py

      - name: Apply KI Tastatur branding
        run: python3 controller/florisboard-ai/apply_branding.py

      - name: Add manual AI correction, style menu and Prompt+
        run: python3 controller/florisboard-ai/apply_ai.py

      - name: Add dynamic AI providers
        run: python3 controller/florisboard-ai/apply_backend.py

      - name: Add local translation
        run: python3 controller/florisboard-ai/apply_translation.py

      - name: Restore true stable package and sign release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('florisboard/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          marker = '        named("release") {\n'
          replacement = '        named("release") {\n            signingConfig = signingConfigs.getByName("debug")\n'
          if marker not in s:
              raise SystemExit('release build block not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Enable locally rebuilt JetPref snapshot
        run: |
          sed -i 's@        // mavenLocal()@        mavenLocal()@' florisboard/settings.gradle.kts
          sed -i 's/projectVersion=0.3.0-beta02/projectVersion=20251119T222500Z-SNAPSHOT/' jetpref/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Rebuild exact JetPref snapshot to Maven Local
        working-directory: jetpref
        run: |
          ./gradlew \
            :datastore-model:publishToMavenLocal \
            :datastore-model-processor:publishToMavenLocal \
            :datastore-ui:publishToMavenLocal \
            :material-ui:publishToMavenLocal

      - name: Build stable KI Tastatur v4 APK
        working-directory: florisboard
        run: ./gradlew clean assembleRelease

      - name: Verify package and APK
        run: |
          APK='florisboard/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -20
          cp "$APK" KI-Tastatur-v0.5.2-v4.apk
          sha256sum KI-Tastatur-v0.5.2-v4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KI-Tastatur-v0.5.2-v4
          path: KI-Tastatur-v0.5.2-v4.apk

      - name: Publish APK as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ki-tastatur-v0.5.2-v4"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "KI Tastatur v0.5.2 v4" \
              --notes "KI Tastatur, basierend auf FlorisBoard v0.5.2 (Apache 2.0). Neue Bedienung: keine zeitgesteuerte Autokorrektur mehr. KI Korrektur startet nur nach bewusstem Druck auf die Smartbar Taste und berücksichtigt den ganzen Absatz sowie Diktatfehler und Sinnzusammenhang. Nutzer Satzzeichen wie !, ?, ?!, !! und … bleiben erhalten. Stil Taste mit Dropdown für Sarkastisch, Flirtend, Verführerisch/Zweideutig, Stilvoll, Geschäftlich, Professionell, Freundlich, Persönlich, Du-Form, Sie-Form, Locker, Humorvoll, Direkt, Kurz und Einfache Sprache. Prompt+ verbessert Rohtexte zu strukturierten KI Prompts. Übersetzen läuft lokal über ML Kit. Anbieter OpenAI, Gemini, Claude und Groq mit dynamischer Modellwahl. Texte werden bewusst natürlich und menschlich formuliert; typische KI Floskeln sowie unnötige Gedankenstriche und Bindestrich Konstruktionen werden vermieden."
          fi
          gh release upload "$TAG" KI-Tastatur-v0.5.2-v4.apk --repo "$GITHUB_REPOSITORY" --clobber
