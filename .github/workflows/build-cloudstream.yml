name: Build Cloudstream Mediatheken

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'ZDF/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'repo.json'
      - '.github/workflows/build-cloudstream.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Checkout Cloudstream Gradle plugin
        uses: actions/checkout@v4
        with:
          repository: recloudstream/gradle
          ref: 69fdb8fc4be2815cbdf5ecec7f407727001cc7c7
          path: cloudstream-gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Publish Cloudstream Gradle plugin locally
        run: |
          cd "$GITHUB_WORKSPACE/cloudstream-gradle"
          gradle publishToMavenLocal

      - name: Build public broadcaster plugin
        run: |
          cd "$GITHUB_WORKSPACE/src"
          gradle make makePluginsJson

      - name: Prepare plugin repository
        run: |
          rm -f "$GITHUB_WORKSPACE/builds"/*.cs3 "$GITHUB_WORKSPACE/builds/plugins.json"
          find "$GITHUB_WORKSPACE/src" -path '*/build/*.cs3' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"
          curl -fsSL https://raw.githubusercontent.com/Bnyro/GermanProviders/builds/plugins.json -o /tmp/germanproviders.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          output = workspace / 'builds' / 'plugins.json'
          upstream = Path('/tmp/germanproviders.json')

          plugins = json.loads(output.read_text(encoding='utf-8'))
          german = json.loads(upstream.read_text(encoding='utf-8'))
          wanted = ["ARD", "Arte", "PlutoTV"]
          upstream_plugins = [next(item for item in german if item.get('internalName') == name) for name in wanted]
          own_names = {item.get('internalName') for item in upstream_plugins}
          plugins = upstream_plugins + [item for item in plugins if item.get('internalName') not in own_names]
          output.write_text(json.dumps(plugins, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update legal German Cloudstream plugins"
          git push
